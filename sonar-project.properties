# ── Identification du projet ──────────────────────────────────────────────────
sonar.projectKey=devops-tp-flask
sonar.projectName=DevOps TP – Flask App
sonar.projectVersion=1.0

# ── Sources & tests ───────────────────────────────────────────────────────────
sonar.sources=app
sonar.tests=app
sonar.test.inclusions=**/test_*.py
sonar.python.coverage.reportPaths=coverage.xml

# ── Quality Gate ──────────────────────────────────────────────────────────────
# Le pipeline s'arrête si les seuils suivants ne sont pas respectés :
# - Couverture de code >= 80 %
# - Duplications < 3 %
# - Pas de bug bloquant ni de vulnérabilité critique

sonar.qualitygate.wait=true

# ── Encodage ──────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
